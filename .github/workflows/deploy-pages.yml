# Сборка фронтенда (vite build) и публикация dist/ в GitHub Pages.
# Запускается на каждый пуш в main. Бэкенд (server.ts) на Pages не деплоится —
# это статический хостинг; API /api/* требует отдельного Node-хостинга.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Карта сайта собирается из данных проекта, а не правится руками —
      # иначе она снова разойдётся со списком реальных страниц.
      - name: Generate sitemap
        run: npm run sitemap

      - name: Build frontend
        run: npx vite build

      # 404.html для прямых ссылок + настоящий index.html в каталоге каждого
      # языка. Без второго корень языковой версии (/ru/) отдавался бы со
      # статусом 404: сайт выглядел бы рабочим, а поисковик считал бы, что
      # страницы нет. Список языков берётся из src/data/languages.ts.
      - name: Add SPA fallback and language roots
        run: npm run spa:fallback

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
