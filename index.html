<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- theme-color красит панели Safari/Chrome (строка состояния и адресная
         строка) в цвет фона страницы. Тег здесь нужен для первого кадра, пока
         не отработал JS; тот же цвет ставит Seo, см. src/components/Seo.tsx. -->
    <meta name="theme-color" content="#F0F4FF" />

    <!-- Запуск с домашнего экрана без интерфейса браузера: только в этом режиме
         контент может уходить под системную строку (часы, Wi-Fi, батарея).
         В обычной вкладке Safari эти теги ни на что не влияют. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RoyalDent" />
    <!-- black-translucent: системная строка становится прозрачной, фон страницы
         уходит под часы и батарею. Плата — текст строки всегда белый, поэтому
         полосу safe-area на светлых маршрутах притемняем (см. .safe-area-scrim
         в index.css), иначе часы на #F0F4FF были бы нечитаемы. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Consent Mode v2: значения по умолчанию.
         Должны выставляться ДО загрузки любого тега Google, поэтому лежат
         прямо здесь, а не в React — иначе тег успел бы поставить куки раньше,
         чем посетитель ответит на баннер.
         Всё запрещено до явного согласия; после выбора src/lib/consent.ts
         шлёт 'consent' 'update'. Сами теги подключаются отдельно. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>

    <title>RoyalDent — Стоматология в Юрмале | Имплантация и лечение под микроскопом</title>
    <meta
      name="description"
      content="Современная стоматология RoyalDent в Юрмале без боли и страха. Имплантация, лечение под микроскопом, эстетическая стоматология, профессиональная гигиена и отбеливание. Запишитесь на приём."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://royaldent.lv/" />

    <!-- Критические ресурсы первого экрана начинаем загружать до запуска React. -->
    <link
      rel="preload"
      href="/images/clinic/IMG_4273.jpg_2K_202607182302.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/fonts/google/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/google/inter-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/google/playfair-italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/google/playfair-italic-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoyalDent" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://royaldent.lv/" />
    <meta property="og:title" content="RoyalDent — Стоматология в Юрмале" />
    <meta
      property="og:description"
      content="Современная стоматология без боли и страха. Имплантация, лечение под микроскопом, эстетика и гигиена."
    />
    <meta property="og:image" content="https://royaldent.lv/brand/favicon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoyalDent — Стоматология в Юрмале" />
    <meta
      name="twitter:description"
      content="Современная стоматология без боли и страха. Имплантация, лечение под микроскопом, эстетика и гигиена."
    />
    <meta name="twitter:image" content="https://royaldent.lv/brand/favicon.png" />

        "url": "https://royaldent.lv/",
        "image": "https://royaldent.lv/brand/favicon.png",
        "logo": "https://royaldent.lv/brand/favicon.png",
        "telephone": "+37127057783",
        "email": "info@royaldent.lv",
        "priceRange": "€€",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Piestātnes iela 11A",
          "addressLocality": "Jūrmala",
          "postalCode": "LV-2015",
          "addressCountry": "LV"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 56.9775754,

        },

          {

  </head>
  <body>
    <div id="root"></div>

</html>
